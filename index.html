<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content= "width=device-width, Initial-scale=1.0">
        <title>Plant it All</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
        <script src="https://kit.fontawesome.com/7cc336583f.js" crossorigin="anonymous"></script>
    </head>
    <body>
      <div class="body">
    
        
        <div class="container p-4 p-lg-5">
            
            <!--search bar-->
        <div class="search-box border-dark">
        <div class="row rounded ">
            <input type="text" id="inputBox"  placeholder= "Search anything" autocomplete="off">
            <button id="search"> <i class=" mx-4 rounded fa-solid fa-magnifying-glass" ></i> </button>
            </div>
        </div>
            
            <!--content-->
            <div class="row p-2 p-md-4 p-lg-5">
                <div class="col-lg-4 col-md-4 col-sm-12 p-0">
                    <!--IMAGE RESULT-->
                    <div id="plant-img" class="flower-bg h-100">
                    </div>
                </div>
                
                <div class="col card p-3 shadow border-dark">
                    
                    <h3 class="hdr">Plant it All</h3>
                    <p>Plant facts at your fingertips!</p>
                    
                    <hr>
                    
                    <h1 id="plant-name"><i class="fa-solid fa-fan"></i></h1>
                    
                    <!--TABLE-->
                    <table class="table border rounded-circle">
                        <tbody>
                            <tr>
                                <th scope="row" class="table-bg">Scientific Name</th>
                                <td>
                                    <p id="sci-name"></p>
                                </td>
                            </tr>
                            <tr>
                                <th scope="row" class="table-bg">Family</th>
                                <td>
                                    <p id="family-name"></p>
                                </td>
                            </tr>
                            <tr>
                                <th scope="row" class="table-bg">Year Discovered</th>
                                <td>
                                    <p id="year"></p>
                                </td>
                            </tr>
                            <tr>
                                <th scope="row" class="table-bg">Genus</th>
                                <td>
                                    <p id="genus"></p>
                                </td>
                            </tr>
                            
                        </tbody>
                    </table>
                    
                    
                    
                </div>
            </div>
        </div>
        
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
